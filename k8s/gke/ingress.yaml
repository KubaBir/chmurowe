# HTTP(S) load balancer sends all paths to the frontend nginx.
# Nginx proxies /api/* to backend-service (see frontend/nginx.default.conf).
apiVersion: networking.k8s.io/v1
kind: Ingress
metadata:
  name: chmurowe-ingress
spec:
  ingressClassName: gce
  rules:
    - http:
        paths:
          - path: /
            pathType: Prefix
            backend:
              service:
                name: frontend-service
                port:
                  number: 80
