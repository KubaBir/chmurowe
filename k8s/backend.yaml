apiVersion: v1
kind: Pod
metadata:
  name: backend-pod
  labels:
    app: backend
spec:
  containers:
    - name: backend
      image: spotify-backend
      imagePullPolicy: IfNotPresent
      env:
        - name: DATABASE_URL
          value: postgresql://spotify:spotify@db-service:5432/spotify_db
        - name: PORT
          value: "8080"
      ports:
        - containerPort: 8080
      livenessProbe:
        httpGet:
          path: /songs
          port: 8080
        initialDelaySeconds: 15
        periodSeconds: 10
        timeoutSeconds: 5
        failureThreshold: 3

---
apiVersion: v1
kind: Service
metadata:
  name: backend-service
spec:
  type: NodePort
  selector:
    app: backend
  ports:
    - protocol: TCP
      port: 8080
      targetPort: 8080
      nodePort: 30001
