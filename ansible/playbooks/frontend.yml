---
- name: Provisioning frontendu (Node + Vite)
  hosts: all
  become: true

  tasks:
    - name: Apt update
      ansible.builtin.apt:
        update_cache: true
        cache_valid_time: 3600

    - name: curl
      ansible.builtin.apt:
        name:
          - ca-certificates
          - curl
        state: present

    - name: NodeSource setup 20.x
      ansible.builtin.shell: |
        set -euo pipefail
        curl -fsSL https://deb.nodesource.com/setup_20.x | bash -
      args:
        creates: /etc/apt/sources.list.d/nodesource.list
      changed_when: true

    - name: Instalacja Node.js 20
      ansible.builtin.apt:
        name: nodejs
        state: present
        update_cache: true

    - name: Szablon .env frontendu (API po adresie prywatnym backendu)
      ansible.builtin.template:
        src: "{{ (playbook_dir | dirname) }}/templates/frontend.env.j2"
        dest: /vagrant/frontend/.env
        owner: vagrant
        group: vagrant
        mode: "0640"

    - name: Zależności npm (frontend)
      ansible.builtin.command: npm install
      args:
        chdir: /vagrant/frontend
      become: true
      become_user: vagrant
      register: npm_fe
      changed_when: true

    - name: Jednostka systemd — serwer deweloperski Vite
      ansible.builtin.template:
        src: "{{ (playbook_dir | dirname) }}/templates/chmurowe-frontend.service.j2"
        dest: /etc/systemd/system/chmurowe-frontend.service
        mode: "0644"
      notify:
        - Reload systemd
        - Restart chmurowe-frontend

    - name: Włączenie i start Vite (nasłuch 0.0.0.0 — forwarded_port)
      ansible.builtin.systemd:
        name: chmurowe-frontend
        enabled: true
        state: started
        daemon_reload: true

  handlers:
    - name: Reload systemd
      ansible.builtin.systemd:
        daemon_reload: true

    - name: Restart chmurowe-frontend
      ansible.builtin.systemd:
        name: chmurowe-frontend
        state: restarted
